<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operation Mousebot – Trailer</title>
<style>
:root{color-scheme:dark;--bg:#030603;--fg:#39ff7a;--dim:#1c7a3e;--red:#ff3b30;--amb:#ffb000;--w:#eaffea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;overflow:hidden}
#stage{position:relative;width:100%;height:100%;overflow:hidden}
#cam{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#view{font-size:clamp(13px,2.3vw,24px);text-align:center;max-width:94%}
#view.term{text-align:left;min-width:min(30em,90%)}
#view.term div{margin:.35em 0;text-shadow:0 0 8px var(--fg)}
.hd{color:var(--amb);letter-spacing:.12em;margin-bottom:1em;font-size:.85em}
.grid{display:grid;gap:.4em;justify-content:center}
.g5{grid-template-columns:repeat(5,3.2em)}
.grid i{font-style:normal;border:1px solid var(--dim);padding:.5em 0}
.g9{grid-template-columns:repeat(9,2em);gap:0}
.g9 i{padding:.25em 0;border:1px solid #0f3a1f;color:transparent}
.g9 i.f{color:var(--w)}.g9 i.g{color:var(--fg);text-shadow:0 0 8px var(--fg)}
.on{background:var(--dim);color:#000}
.lock{border-color:var(--red)!important;color:var(--red);animation:blink .25s infinite}
.dead{background:var(--red);color:#000;border-color:var(--red)!important}
.code{display:flex;gap:.6em;justify-content:center}
.code b{font-size:3em;width:1.4em;border:2px solid var(--fg);text-shadow:0 0 12px var(--fg)}
.rep{margin-top:1em;min-height:1.4em}
.maze{white-space:pre;line-height:1.15;font-size:.85em}
.big{font-size:clamp(34px,9vw,110px);font-weight:900;letter-spacing:.04em;color:var(--w);animation:slam .35s cubic-bezier(.2,2,.4,1);text-shadow:0 0 24px currentColor}
.big.r{color:var(--red)}.big.a{color:var(--amb)}.big.g{color:var(--fg)}
.big.t{font-size:clamp(30px,8.5vw,96px);line-height:1}
.sm{letter-spacing:.2em;color:var(--dim);margin:.6em 0}
.tag{font-size:1.2em;margin:.8em 0;color:var(--amb)}
.bl{animation:blink 1s steps(2) infinite}
@keyframes slam{from{transform:scale(2.6);opacity:0}to{transform:none;opacity:1}}
@keyframes blink{50%{opacity:.15}}
@keyframes sh{20%{transform:translate(-9px,5px)}40%{transform:translate(8px,-6px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,4px)}}
@keyframes fl{from{opacity:.9}to{opacity:0}}
.sh{animation:sh .35s}
@media (prefers-reduced-motion:reduce){.sh{animation:none}}
#flash{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:4}
#scan{position:absolute;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75))}
.bar{position:absolute;left:0;right:0;height:8%;background:#000;z-index:5}
#hud{position:absolute;top:calc(8% + 10px);left:14px;right:14px;display:flex;justify-content:space-between;z-index:6;font-size:clamp(12px,1.8vw,20px);opacity:0;transition:opacity .3s}
#hud b{font-size:1.8em;color:var(--w);text-shadow:0 0 12px var(--fg)}
#hud.low b{color:var(--red);text-shadow:0 0 14px var(--red);animation:blink .5s infinite}
#hud i{color:var(--red);font-style:normal;animation:blink 1s infinite}
#intro{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em;background:var(--bg);text-align:center}
#intro.end{background:transparent;justify-content:flex-end;padding-bottom:12%;pointer-events:none}
#intro.end h1,#intro.end p{display:none}
#intro h1{margin:0;font-size:clamp(22px,5vw,48px);color:var(--w)}
#intro p{margin:0;color:var(--dim)}
#intro button{pointer-events:auto;font:inherit;font-size:clamp(15px,2.4vw,22px);color:#000;background:var(--fg);border:0;padding:.7em 1.6em;cursor:pointer;box-shadow:0 0 22px var(--fg)}
#intro button:focus-visible{outline:3px solid var(--w);outline-offset:3px}
</style>
</head>
<body>
<div id="stage">
  <div id="cam"><div id="view"></div></div>
  <div id="hud"><span><i>●</i> REC</span><span>MICEBOT LEFT <b>10</b></span></div>
  <div class="bar" style="top:0"></div><div class="bar" style="bottom:0"></div>
  <div id="flash"></div><div id="scan"></div>
  <div id="intro">
    <h1>OPERATION MOUSEBOT</h1>
    <p>Official trailer. Sound on.</p>
    <button id="btn" autofocus>▶ PLAY TRAILER</button>
  </div>
</div>
<script>
const $=s=>document.querySelector(s),v=$('#view'),hud=$('#hud'),cam=$('#cam');
let tok=0,AC=null;
const sleep=async ms=>{const t=tok;await new Promise(r=>setTimeout(r,ms));if(t!==tok)throw 0};
function snd(f,d=.08,t='square',g=.04){if(!AC)return;const o=AC.createOscillator(),a=AC.createGain();o.type=t;o.frequency.value=f;a.gain.value=g;a.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(a).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function boom(){if(!AC)return;const n=AC.sampleRate*.7,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=500;g.gain.value=.5;s.buffer=b;s.connect(f).connect(g).connect(AC.destination);s.start()}
function hit(c='#fff'){const f=$('#flash');f.style.background=c;f.style.animation='none';f.offsetWidth;f.style.animation='fl .45s ease-out';cam.classList.remove('sh');cam.offsetWidth;cam.classList.add('sh');boom()}
const clear=()=>{v.innerHTML=''};
function line(cls='',txt=''){const d=document.createElement('div');d.className=cls;d.textContent=txt;v.appendChild(d);return d}
async function type(el,txt,sp=28){for(const c of txt){el.textContent+=c;if(c!==' ')snd(900+Math.random()*300,.02,'square',.015);await sleep(sp)}}
function setHud(n){hud.querySelector('b').textContent=String(n).padStart(2,'0');hud.classList.toggle('low',n<=3)}
async function die(n){setHud(n);hit('#ff3b30');await sleep(260)}
const pad=i=>String(i).padStart(2,'0');
function room(){const g=line('grid g5'),c=[];for(let i=1;i<=25;i++){const e=document.createElement('i');e.textContent=pad(i);g.appendChild(e);c.push(e)}return c}

async function mapScene(){
  clear();v.className='';const h=line('hd','UNIT 10 | EXPLORER | SCANNING ROW');const c=room();
  for(let r=0;r<5;r++){c.forEach((e,i)=>e.classList.toggle('on',Math.floor(i/5)===r));snd(300+r*80,.1);await sleep(170)}
  c.forEach(e=>e.classList.remove('on'));c[13].classList.add('lock');
  h.textContent='REPORT: SOMETHING SPECIAL IN THIS ROW';snd(880,.25);await sleep(750);
}
async function codeScene(){
  clear();const h=line('hd','UNIT 09 | PASSWORD LOCK');const d=line('code'),s=[0,1,2].map(()=>{const e=document.createElement('b');e.textContent='?';d.appendChild(e);return e});
  const fin=[4,8,2],rep=line('rep');
  for(let k=0;k<18;k++){s.forEach((e,i)=>{e.textContent=k<7+i*3?2*Math.floor(Math.random()*5):fin[i]});snd(200+k*30,.04);await sleep(75)}
  await type(rep,'2 CORRECT POSITION, 1 WRONG POSITION',14);await sleep(250);
  rep.style.color='var(--w)';rep.textContent='MOUSEBOT REPORT: PASSWORD CORRECT';snd(1200,.3,'sine',.06);await sleep(550);
}
const M=['###########','#S....#...#','###.#.#.#.#','#...#...#.#','#.#####.#.#','#.......#G#','###########'];
const P=[[1,1],[2,1],[3,1],[4,1],[5,1],[5,2],[5,3],[6,3],[7,3],[7,2],[7,1],[8,1],[9,1],[9,2],[9,3],[9,4],[9,5]];
async function mazeScene(){
  clear();const h=line('hd'),p=line('maze');
  for(let i=0;i<P.length;i++){
    h.textContent='UNIT 08 | MAZE | BATTERY '+(34-i*2)+' STEPS';
    p.textContent=M.map((r,y)=>[...r].map((ch,x)=>{
      if(P[i][0]===x&&P[i][1]===y)return'🐭';
      if(ch==='#')return'██';if(ch==='G')return'G ';
      if(P.slice(0,i).some(q=>q[0]===x&&q[1]===y))return'· ';return'  '}).join('')).join('\n');
    snd(500+i*20,.05);await sleep(95)}
  await sleep(300);
}
async function sudScene(){
  clear();line('hd','UNIT 07 | SUDOKU LOCK');const g=line('grid g9'),c=[];
  for(let r=0;r<9;r++)for(let k=0;k<9;k++){const e=document.createElement('i');e.dataset.v=((r*3+Math.floor(r/3)+k)%9)+1;if(Math.random()<.4){e.textContent=e.dataset.v;e.className='f'}else e.textContent=' ';
    if(k%3===2&&k<8)e.style.borderRight='2px solid var(--dim)';if(r%3===2&&r<8)e.style.borderBottom='2px solid var(--dim)';g.appendChild(e);c.push(e)}
  const em=c.filter(e=>e.className!=='f').sort(()=>Math.random()-.5);
  for(let i=0;i<em.length;i++){em[i].textContent=em[i].dataset.v;em[i].className='g';if(i%3===0){snd(500+i*8,.03);await sleep(38)}}
  await sleep(500);
}
async function rapid(){
  clear();const h=line('hd','ALL UNITS | GO GO GO'),c=room(),bad=[0,4,6,8,10,12,16,18,20,22,24];
  for(let n=5;n>=2;n--){const e=c[bad.shift()];e.textContent='HH';e.classList.add('dead');setHud(n);hit('#ff3b30');await sleep(300)}
  await sleep(250);
}
async function trailer(){
  clear();v.className='term';hud.style.opacity=0;hud.classList.remove('low');setHud(10);
  for(const t of ['> boarding enemy warship...','> 25 rooms detected','> targets: ENGINE + FUEL TANK','> assets: 10 mousebots','> mission: DESTROY BOTH']){await type(line(),t,30);await sleep(220)}
  await sleep(450);hit();clear();v.className='';
  for(const [t,c] of [['ONE WARSHIP.',''],['TWO TARGETS.','r'],['TEN MICE.','a']]){clear();line('big '+c,t);hit(c==='r'?'#ff3b30':'#fff');await sleep(850)}
  clear();hud.style.opacity=1;
  await mapScene();await die(9);
  await codeScene();await die(8);
  await mazeScene();await die(7);
  await sudScene();await die(6);
  await rapid();
  clear();setHud(1);hit('#ff3b30');line('big r','1 MICEBOT LEFT.');snd(110,1.2,'sawtooth',.06);await sleep(1500);
  clear();v.className='term';
  await type(line(),'Mousebot Report: fuel tank destroyed successfully.',22);hit('#ffb000');await sleep(500);
  await type(line(),'Mousebot Report: engine destroyed successfully.',22);hit('#fff');await sleep(300);
  setHud(0);hit('#fff');clear();hud.style.opacity=0;v.className='';
  line('tag','The warship has started to sink.');await sleep(1400);
  clear();line('big g','MISSION COMPLETE');hit('#39ff7a');await sleep(1900);
  clear();line('sm','A TERMINAL SPY GAME');line('big t','OPERATION MOUSEBOT');hit('#fff');await sleep(900);
  line('tag','Small mice. Big explosions.');await sleep(1000);
  line('bl','Press Enter to start your mission.');
  const b=$('#btn');b.textContent='↻ REPLAY';$('#intro').classList.add('end');
}
async function play(){
  tok++;AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  $('#intro').style.display='none';
  try{await trailer()}catch(e){if(e!==0)throw e}
  $('#intro').style.display='flex';
}
$('#btn').addEventListener('click',play);
</script>
</body>
</html>
